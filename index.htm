
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Simulador de Orçamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <header class="cabecalho">
                <span class="marca">TECHSTORE</span>
                <h1>Simulador de Orçamento</h1>
                <p>Preencha os dados para calcular sua compra.</p>
            </header>

            <form id="form-orcamento">
                <div class="campo">
                    <label for="valor-produto">Valor do produto (R$)</label>
                    <input type="number" id="valor-produto"
                        min="0.01" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="pagamento">Forma de pagamento</label>
                    <select id="pagamento" required>
                        <option value="">Selecione</option>
                        <option value="pix">PIX (15%)</option>
                        <option value="boleto">Boleto (10%)</option>
                        <option value="cartao-vista">Cartão à Vista (5%)</option>
                        <option value="cartao-parcelado">Cartão Parcelado (0%)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="entrega">Modalidade de frete</label>
                    <select id="entrega" required>
                        <option value="">Selecione</option>
                        <option value="retirada">Retirada (R$ 0,00)</option>
                        <option value="padrao">Padrão (R$ 12,00)</option>
                        <option value="expressa">Expressa (R$ 25,00)</option>
                        <option value="super-expressa">Super Expressa (R$ 45,00)</option>
                    </select>
                </div>

                <button type="submit">Calcular orçamento</button>
            </form>

            <section id="resultado" class="resultado hidden">
                <h2>Resumo do orçamento</h2>

                <div class="linha">
                    <span>Valor do produto</span>
                    <strong id="resultado-produto"></strong>
                </div>

                <div class="linha">
                    <span>Desconto</span>
                    <strong id="resultado-desconto"></strong>
                </div>

                <div class="linha">
                    <span>Frete</span>
                    <strong id="resultado-frete"></strong>
                </div>

                <div class="linha total">
                    <span>Total final</span>
                    <strong id="resultado-total"></strong>
                </div>
            </section>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
